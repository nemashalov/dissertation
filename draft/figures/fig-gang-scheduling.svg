<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6366f1"/>
    </marker>
  </defs>

  <text x="450" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#1c1e21">Бригадное планирование (gang scheduling)</text>

  <!-- Задача -->
  <rect x="300" y="50" width="300" height="56" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="450" y="73" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e40af">Задача</text>
  <text x="450" y="91" text-anchor="middle" font-size="11" fill="#1e40af">множество связанных потоков</text>

  <!-- Потоки -->
  <g fill="#ffffff" stroke="#2563eb" stroke-width="2">
    <rect x="70" y="170" width="150" height="56" rx="8"/>
    <rect x="260" y="170" width="150" height="56" rx="8"/>
    <rect x="450" y="170" width="150" height="56" rx="8"/>
    <rect x="640" y="170" width="150" height="56" rx="8"/>
  </g>
  <text x="145" y="194" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e40af">Поток 1</text>
  <text x="335" y="194" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e40af">Поток 2</text>
  <text x="525" y="194" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e40af">Поток 3</text>
  <text x="715" y="194" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e40af">Поток 4</text>
  <text x="145" y="213" text-anchor="middle" font-size="11" fill="#334155">часть задачи</text>
  <text x="335" y="213" text-anchor="middle" font-size="11" fill="#334155">часть задачи</text>
  <text x="525" y="213" text-anchor="middle" font-size="11" fill="#334155">часть задачи</text>
  <text x="715" y="213" text-anchor="middle" font-size="11" fill="#334155">часть задачи</text>

  <!-- Стрелки задача -> потоки -->
  <path d="M 390 106 L 150 170" stroke="#6366f1" stroke-width="2" fill="none" marker-end="url(#arr2)"/>
  <path d="M 420 106 L 340 170" stroke="#6366f1" stroke-width="2" fill="none" marker-end="url(#arr2)"/>
  <path d="M 480 106 L 520 170" stroke="#6366f1" stroke-width="2" fill="none" marker-end="url(#arr2)"/>
  <path d="M 520 106 L 700 170" stroke="#6366f1" stroke-width="2" fill="none" marker-end="url(#arr2)"/>

  <!-- Процессоры -->
  <g fill="#eef2ff" stroke="#6366f1" stroke-width="2">
    <rect x="70" y="330" width="150" height="56" rx="8"/>
    <rect x="260" y="330" width="150" height="56" rx="8"/>
    <rect x="450" y="330" width="150" height="56" rx="8"/>
    <rect x="640" y="330" width="150" height="56" rx="8"/>
  </g>
  <text x="145" y="354" text-anchor="middle" font-size="13" font-weight="bold" fill="#3730a3">Процессор 1</text>
  <text x="335" y="354" text-anchor="middle" font-size="13" font-weight="bold" fill="#3730a3">Процессор 2</text>
  <text x="525" y="354" text-anchor="middle" font-size="13" font-weight="bold" fill="#3730a3">Процессор 3</text>
  <text x="715" y="354" text-anchor="middle" font-size="13" font-weight="bold" fill="#3730a3">Процессор 4</text>

  <!-- Стрелки поток -> процессор -->
  <line x1="145" y1="226" x2="145" y2="330" stroke="#6366f1" stroke-width="2" marker-end="url(#arr2)"/>
  <line x1="335" y1="226" x2="335" y2="330" stroke="#6366f1" stroke-width="2" marker-end="url(#arr2)"/>
  <line x1="525" y1="226" x2="525" y2="330" stroke="#6366f1" stroke-width="2" marker-end="url(#arr2)"/>
  <line x1="715" y1="226" x2="715" y2="330" stroke="#6366f1" stroke-width="2" marker-end="url(#arr2)"/>

  <!-- Синхронизация -->
  <line x1="70" y1="300" x2="790" y2="300" stroke="#059669" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="450" y="294" text-anchor="middle" font-size="12" font-weight="bold" fill="#047857">одновременный запуск по одному потоку на процессор</text>

  <!-- Вывод -->
  <rect x="120" y="430" width="660" height="64" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="450" y="456" text-anchor="middle" font-size="13" font-weight="bold" fill="#065f46">Эффект</text>
  <text x="450" y="476" text-anchor="middle" font-size="12" fill="#065f46">меньше блокировок из-за синхронизации и меньше переключений процессов</text>
</svg>