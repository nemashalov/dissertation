<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6366f1"/>
    </marker>
  </defs>

  <text x="450" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#1c1e21">Архитектура эластичной вычислительной системы</text>

  <!-- Планировщик -->
  <rect x="330" y="48" width="240" height="56" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="450" y="71" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e40af">Планировщик</text>
  <text x="450" y="90" text-anchor="middle" font-size="11" fill="#1e40af">размещение и масштабирование нагрузки</text>
  <line x1="450" y1="104" x2="450" y2="130" stroke="#6366f1" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Вычислительная сеть -->
  <rect x="60" y="132" width="780" height="42" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="450" y="152" text-anchor="middle" font-size="14" font-weight="bold" fill="#3730a3">Вычислительная сеть</text>
  <text x="450" y="168" text-anchor="middle" font-size="11" fill="#3730a3">обмен данными между вычислительными узлами</text>

  <!-- Вычислительные узлы -->
  <g fill="#ffffff" stroke="#2563eb" stroke-width="2">
    <rect x="90" y="210" width="180" height="96" rx="8"/>
    <rect x="360" y="210" width="180" height="96" rx="8"/>
    <rect x="630" y="210" width="180" height="96" rx="8"/>
  </g>
  <text x="180" y="242" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e40af">Узел 1</text>
  <text x="450" y="242" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e40af">Узел 2</text>
  <text x="720" y="242" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e40af">Узел N</text>
  <text x="180" y="264" text-anchor="middle" font-size="11" fill="#334155">процессоры</text>
  <text x="450" y="264" text-anchor="middle" font-size="11" fill="#334155">процессоры</text>
  <text x="720" y="264" text-anchor="middle" font-size="11" fill="#334155">процессоры</text>
  <text x="180" y="282" text-anchor="middle" font-size="11" fill="#334155">память</text>
  <text x="450" y="282" text-anchor="middle" font-size="11" fill="#334155">память</text>
  <text x="720" y="282" text-anchor="middle" font-size="11" fill="#334155">память</text>
  <line x1="180" y1="174" x2="180" y2="210" stroke="#6366f1" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="450" y1="174" x2="450" y2="210" stroke="#6366f1" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="720" y1="174" x2="720" y2="210" stroke="#6366f1" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Сеть хранения данных -->
  <line x1="180" y1="306" x2="180" y2="352" stroke="#0e7490" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="450" y1="306" x2="450" y2="352" stroke="#0e7490" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="720" y1="306" x2="720" y2="352" stroke="#0e7490" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="60" y="354" width="780" height="42" rx="8" fill="#ecfeff" stroke="#0e7490" stroke-width="2"/>
  <text x="450" y="374" text-anchor="middle" font-size="14" font-weight="bold" fill="#155e75">Сеть хранения данных (SAN)</text>
  <text x="450" y="390" text-anchor="middle" font-size="11" fill="#155e75">разделяемые дисковые ресурсы</text>

  <!-- Хранилища -->
  <g fill="#ffffff" stroke="#0e7490" stroke-width="2">
    <rect x="150" y="432" width="200" height="70" rx="8"/>
    <rect x="550" y="432" width="200" height="70" rx="8"/>
  </g>
  <text x="250" y="464" text-anchor="middle" font-size="12" font-weight="bold" fill="#155e75">Хранилище 1</text>
  <text x="650" y="464" text-anchor="middle" font-size="12" font-weight="bold" fill="#155e75">Хранилище M</text>
  <text x="250" y="482" text-anchor="middle" font-size="11" fill="#334155">разделяемые данные</text>
  <text x="650" y="482" text-anchor="middle" font-size="11" fill="#334155">разделяемые данные</text>
  <line x1="250" y1="396" x2="250" y2="432" stroke="#0e7490" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="650" y1="396" x2="650" y2="432" stroke="#0e7490" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Подпись -->
  <text x="450" y="540" text-anchor="middle" font-size="12" font-style="italic" fill="#6b7280">Эластичность достигается переносом и масштабированием нагрузки между узлами</text>
  <text x="450" y="558" text-anchor="middle" font-size="12" font-style="italic" fill="#6b7280">по общей вычислительной сети и с использованием разделяемого хранилища</text>
</svg>